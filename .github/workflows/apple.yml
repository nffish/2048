name: Apple app

on:
  push:
    paths: ["apple/**", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["apple/**", ".github/workflows/apple.yml"]

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4
      - name: Game rules tests
        run: swift test
      - name: Build for iOS Simulator
        run: xcodebuild -project Game2048.xcodeproj -scheme Game2048 -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40; exit ${PIPESTATUS[0]}
      - name: Build for macOS
        run: xcodebuild -project Game2048.xcodeproj -scheme Game2048 -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build | tail -n 40; exit ${PIPESTATUS[0]}
